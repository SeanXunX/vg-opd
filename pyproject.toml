[project]
name = "cropd"
version = "0.0.1"
description = "VG-OPD: Verifier-Gated Multi-Expert On-Policy Distillation for Scientific Reasoning"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "verl",
    "torch==2.8.0",
    "vllm==0.11.0",
    "transformers==4.57.6",
    "peft==0.19.1",
    "ray[default]==2.55.1",
    "flashinfer-python==0.5.3",
    "tensordict==0.10.0",
    "hydra-core==1.3.2",
    "accelerate==1.13.0",
    "flash-attn",
    "wandb",
    "datasets",
    "pyarrow",
    "pandas",
    "sympy",
    "pint",
    "math-verify",
    "rapidfuzz",
    "openai",
    "ninja>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cropd"]

[tool.uv.sources]
verl = { path = "third_party/verl", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
